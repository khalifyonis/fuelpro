version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fuelpro-postgres
    restart: always
    environment:
      POSTGRES_USER: fuelpro_user
      POSTGRES_PASSWORD: fuelpro_pass
      POSTGRES_DB: fuelpro_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fuelpro_user -d fuelpro_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
